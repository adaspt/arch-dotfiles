# Noctalia settings. Noctalia reads this file, then applies what you change in its settings window on top
# (saved in ~/.local/state/noctalia/settings.toml). To see everything you've changed, to copy it here:
#   noctalia config export --credentials omit
config_version = 20

[bar.default]
margin_ends = 0
radius = 0
# The default right side without "media": a changing song title is distracting. What's playing
# is in the control center (Super+S).
end = [
    "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness",
    "battery", "control-center", "session",
]
# Day of the week and date before the time: Fri 20 Nov 18:45. "date" is Noctalia's built-in
# date widget.
center = ["date", "clock"]

# Screen off at 8 minutes, lock at 10, suspend at 60
[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 480.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 3600.0

# For the weather
[location]
address = "Kaunas, Lithuania"

# Keybind cheat sheet on Super+Shift+/ (keybinds.lua). Noctalia fetches it from its community
# plugins repo. It reads the binds and their descriptions from Hyprland.
[plugins]
enabled = ["kenn/keybind-cheatsheet"]

# It also scans the config for the "-- 1. Name" headings that become its sections. Scanning the
# whole hyprland.lua took longer than Noctalia lets a plugin run, so it scans only the binds.
[plugin_settings."kenn/keybind-cheatsheet"]
hyprland_lua_config = "~/.config/hypr/keybinds.lua"

# Shows the password window when an app needs admin rights (polkit), e.g. fwupd or mounting a disk
[shell]
polkit_agent = true

[theme]
builtin = "Nord"
mode = "light"
shell_mode = "dark"

# setup.sh copies the wallpaper here from OneDrive
[wallpaper]
directory = "/home/adas/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/adas/Pictures/Wallpapers/winter-mountain-3840x2160-24311.jpg"
